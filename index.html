<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journey Tracker</title>
    <style>
        /* Base Dark Theme */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            padding-bottom: 80px; /* Space for floating timer */
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .nav-tabs button {
            flex: 1;
            background-color: #333;
            color: white;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 8px;
        }
        .nav-tabs button.active {
            border: 2px solid #ffffff;
            font-weight: bold;
        }

        /* Card Containers */
        .card {
            border: 1px solid #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #1e1e1e;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        /* Inputs & Textareas */
        input[type="text"], input[type="time"], input[type="number"], select, textarea {
            background-color: #2c2c2c;
            color: #ffffff;
            border: 1px solid #ffffff;
            border-radius: 4px;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 8px;
            margin-bottom: 15px;
            font-size: 1rem;
        }
        textarea { resize: vertical; min-height: 100px; }

        /* Buttons */
        button {
            border: none;
            border-radius: 4px;
            padding: 12px 20px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            color: white;
        }
        .btn-red { background-color: #8B0000; }
        .btn-red:hover { background-color: #660000; }
        
        .btn-blue { background-color: #1e3a8a; } /* Dark Blue from screenshot */
        .btn-blue:hover { background-color: #172a68; }

        /* Tab 2 Specific Styles */
        .routine-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .exercise-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .exercise-row input[type="number"] {
            width: 70px;
            margin: 0;
        }
        .set-checkboxes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .set-box {
            background-color: #1e3a8a;
            padding: 10px 15px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-add-set {
            width: auto;
            padding: 10px 15px;
        }

        /* Floating Rest Timer */
        #rest-timer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1e3a8a;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            display: none; /* Hidden until a set is clicked */
            box-sizing: border-box;
            border-top: 2px solid white;
        }

        /* Hide tabs by default */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <div class="nav-tabs">
        <button id="nav-tab1" class="active" onclick="switchTab('tab1')">Spirit (Red)</button>
        <button id="nav-tab2" onclick="switchTab('tab2')">Exercise (Blue)</button>
    </div>

    <!-- TAB 1: SPIRIT -->
    <div id="tab1" class="tab-content active">
        <div class="card">
            <h2>Sleep Log (Goal: 7.5 hrs)</h2>
            <label>Bedtime:</label><input type="time" id="bedtime">
            <label>Wake Time:</label><input type="time" id="waketime">
            <button class="btn-red" onclick="saveSleep()">SAVE SLEEP</button>
        </div>
        <div class="card">
            <h2>Daily Scripture & Journal</h2>
            <label>Reference:</label><input type="text" id="scripture-ref" placeholder="Enter book and chapter...">
            <button class="btn-red" style="margin-bottom: 15px;" onclick="alert('API Placeholder')">FETCH SCRIPTURE</button>
            <label>Key Points & Meditations:</label><textarea id="journal-entry" placeholder="Write your thoughts here..."></textarea>
            <button class="btn-red" onclick="saveMeditation()">SAVE MEDITATION</button>
        </div>
        <div class="card">
            <h2>Fasting Commitment</h2>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="fast-duration" placeholder="0" style="flex: 2;">
                <select id="fast-unit" style="flex: 1;">
                    <option value="hours">Hours</option>
                    <option value="days">Days</option>
                </select>
            </div>
            <button class="btn-red" onclick="logFast()">LOG FAST</button>
        </div>
    </div>

    <!-- TAB 2: EXERCISE -->
    <div id="tab2" class="tab-content">
        <!-- Daily Weight -->
        <div class="card">
            <h2>Today's Vitals</h2>
            <label>Bodyweight (lbs):</label>
            <input type="number" id="daily-weight" placeholder="e.g., 185">
        </div>

        <!-- Routine Selector -->
        <div class="routine-selector">
            <button class="btn-blue" onclick="alert('Will load Pull routine')">PULL</button>
            <button class="btn-blue" onclick="alert('Will load Push routine')">PUSH</button>
            <button class="btn-blue" onclick="alert('Will load Walk routine')">WALK</button>
        </div>

        <!-- Sample Exercise Card -->
        <div class="card">
            <h2>Chest Press</h2>
            <div class="exercise-row">
                <label>Wt:</label><input type="number" value="75">
                <label>Reps:</label><input type="number" value="10">
            </div>
            <div class="set-checkboxes">
                <label class="set-box"><input type="checkbox" onclick="startTimer()"> Set 1</label>
                <label class="set-box"><input type="checkbox" onclick="startTimer()"> Set 2</label>
                <label class="set-box"><input type="checkbox" onclick="startTimer()"> Set 3</label>
                <button class="btn-blue btn-add-set">+ Set</button>
            </div>
        </div>
    </div>

    <!-- Floating Timer -->
    <div id="rest-timer-bar">
        Rest: <span id="timer-display">40</span>s
    </div>

    <script>
        // --- TAB SWITCHING ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
        }

        // --- REST TIMER ---
        let timerInterval;
        function startTimer() {
            clearInterval(timerInterval);
            let timeLeft = 40;
            const timerBar = document.getElementById('rest-timer-bar');
            const display = document.getElementById('timer-display');
            
            timerBar.style.display = 'block';
            display.innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                display.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerBar.style.display = 'none';
                    alert("Rest complete! Time for your next set.");
                    // We will add the actual audio chime here later
                }
            }, 1000);
        }

        // --- TAB 1 SCORING (Preserved from earlier) ---
        function saveSleep() { /* Logic intact */ alert('Sleep Saved!'); }
        function saveMeditation() { /* Logic intact */ alert('Meditation Saved!'); }
        function logFast() { /* Logic intact */ alert('Fast Logged!'); }
    </script>
</body>
</html>
