<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journey - Spirit</title>
    <style>
        /* Base Dark Theme */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Card Containers (White Outlines) */
        .card {
            border: 1px solid #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #1e1e1e;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        /* Inputs & Textareas */
        input[type="text"], input[type="time"], input[type="number"], select, textarea {
            background-color: #2c2c2c;
            color: #ffffff;
            border: 1px solid #ffffff;
            border-radius: 4px;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 8px;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Dark Red Accent Buttons */
        button {
            background-color: #8B0000; /* Dark Red */
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px 20px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        button:hover {
            background-color: #660000;
        }

        /* Placeholder Text styling */
        .placeholder-text {
            font-style: italic;
            color: #aaaaaa;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #2c2c2c;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Tab 1: Spiritual Journey -->
    <div id="tab1-spirit">
        
        <!-- Sleep Tracker -->
        <div class="card">
            <h2>Sleep Log (Goal: 7.5 hrs)</h2>
            <label>Bedtime:</label>
            <input type="time" id="bedtime">
            <label>Wake Time:</label>
            <input type="time" id="waketime">
            <button onclick="alert('Placeholder: Sleep score will be calculated here.')">SAVE SLEEP</button>
        </div>

        <!-- Scripture & Journal -->
        <div class="card">
            <h2>Daily Scripture & Journal</h2>
            <label>Reference (e.g., Romans 12:1-2):</label>
            <input type="text" id="scripture-ref" placeholder="Enter book and chapter...">
            
            <button style="margin-bottom: 15px;" onclick="alert('Placeholder: API will fetch verses here.')">FETCH SCRIPTURE</button>
            
            <!-- API Placeholder Box -->
            <div class="placeholder-text">
                "Therefore, I urge you, brothers and sisters, in view of God’s mercy, to offer your bodies as a living sacrifice..." (API Text Will Appear Here)
            </div>

            <label>Key Points & Meditations:</label>
            <textarea id="journal-entry" placeholder="Write your thoughts here..."></textarea>
            
            <button onclick="alert('Placeholder: Reading and Journaling points will be calculated based on volume.')">SAVE MEDITATION</button>
        </div>

        <!-- Fasting Log -->
        <div class="card">
            <h2>Fasting Commitment</h2>
            <label>Type of Fast:</label>
            <input type="text" id="fast-type" placeholder="e.g., Water only, Daniel fast...">
            
            <label>Duration:</label>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="fast-duration" placeholder="0" style="flex: 2;">
                <select id="fast-unit" style="flex: 1;">
                    <option value="hours">Hours</option>
                    <option value="days">Days</option>
                </select>
            </div>
            
            <button onclick="alert('Placeholder: Fasting points will be added to total.')">LOG FAST</button>
        </div>

    </div>

</body>
</html>
